<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Images - DYNA</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 2rem;
            min-height: 100vh;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #1a202c;
            margin-bottom: 0.5rem;
            font-size: 2rem;
        }
        .subtitle {
            color: #718096;
            margin-bottom: 2rem;
            font-size: 1.1rem;
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 1.5rem;
            border-radius: 12px;
            text-align: center;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            display: block;
            margin-bottom: 0.5rem;
        }
        .stat-label {
            opacity: 0.9;
            font-size: 0.9rem;
        }
        .status {
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            font-weight: 600;
            text-align: center;
            font-size: 1.1rem;
        }
        .loading { background: #fef3c7; color: #92400e; }
        .success { background: #d1fae5; color: #065f46; }
        .error { background: #fee2e2; color: #991b1b; }
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1rem;
        }
        .image-item {
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 1rem;
            transition: all 0.3s ease;
            background: #f8fafc;
        }
        .image-item:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        .image-item.loaded {
            border-color: #10b981;
            background: #ecfdf5;
        }
        .image-item.failed {
            border-color: #ef4444;
            background: #fef2f2;
        }
        .image-wrapper {
            width: 100%;
            height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: white;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 0.75rem;
        }
        .image-wrapper img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .image-name {
            font-size: 0.75rem;
            color: #64748b;
            word-break: break-all;
            text-align: center;
            line-height: 1.3;
        }
        .image-item.loaded .image-name {
            color: #059669;
            font-weight: 600;
        }
        .image-item.failed .image-name {
            color: #dc2626;
            font-weight: 600;
        }
        .status-icon {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f4f6;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .test-info {
            background: #eff6ff;
            border-left: 4px solid #3b82f6;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 8px;
        }
        .test-info h3 {
            color: #1e40af;
            margin-bottom: 0.5rem;
        }
        .test-info code {
            background: #dbeafe;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-family: monospace;
            color: #1e40af;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🖼️ Image Path Test</h1>
        <p class="subtitle">Kiểm tra tất cả 59 ảnh được sử dụng trong DYNA Landing Page</p>
        
        <div class="test-info">
            <h3>📍 Đường dẫn đang test:</h3>
            <p>Tất cả ảnh sử dụng format: <code>/images/filename.png</code></p>
            <p>Files thực tế nằm trong: <code>public/images/</code></p>
        </div>
        
        <div class="stats">
            <div class="stat-card">
                <span class="stat-number" id="loaded-count">0</span>
                <span class="stat-label">✅ Loaded</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="failed-count">0</span>
                <span class="stat-label">❌ Failed</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="total-count">59</span>
                <span class="stat-label">📊 Total</span>
            </div>
            <div class="stat-card">
                <span class="stat-number" id="progress">0%</span>
                <span class="stat-label">⏳ Progress</span>
            </div>
        </div>
        
        <div id="status" class="status loading">
            <div class="status-icon"><div class="loading-spinner"></div></div>
            <div>Đang tải ảnh...</div>
        </div>
        
        <div class="image-grid" id="image-grid"></div>
    </div>

    <script>
        const images = [
            'Avatar@3x.png', 'Avatar4@3x.png', 'Avatar10@3x.png', 'Bullet.svg',
            'Card-Image@3x.png', 'Card-Image1@3x.png', 'Card-Image2@3x.png',
            'Community-icon.svg', 'Community-icon1.svg', 'Community-icon2.svg',
            'Content-Block-Cursor.svg', 'Content-Block@2x.png', 'Content-Block1@2x.png',
            'Content-Block2@2x.png', 'Content.svg', 'Contrast-border@2x.png',
            'Frame-1321314117@2x.png', 'Frame-2087327353.svg', 'Frame-2087327354-4@2x.png',
            'Frame-2087327364@3x.png', 'Frame-20873273641@3x.png', 'Frame.svg', 'Frame1.svg',
            'Group-39465.svg', 'Group-39466.svg', 'Icon-Container.svg',
            'Image-Block@3x.png', 'Image-Block1@3x.png', 'Image-Frame@2x.png', 'Image@2x.png',
            'Menu-button.svg', 'Menu-button1@2x.png', 'Partern.svg', 'Popular-Icon.svg',
            'Profile-image@3x.png', 'Rectangle-647@2x.png', 'Rectangle-649@2x.png',
            'Rectangle-6491@2x.png', 'Rectangle-6492@2x.png', 'Rectangle-6493@2x.png',
            'Search-Image@2x.png', 'Search-Image1@2x.png', 'Star.svg',
            'Tencent-TDSQL-C@2x.png', 'TencentDB-for-MariaDB@2x.png',
            'Testimonial-Card@3x.png', 'Vector.svg', 'elements.svg', 'elements1.svg',
            'elements2.svg', 'icon.svg', 'image-62@2x.png', 'img-01@2x.png',
            'img-02@3x.png', 'img-03@2x.png', 'lucide-chevron-down.svg',
            'pexels-eric-dekker-3334048-1@2x.png', 'search-magnifying-glass.svg', 'svg-planet@2x.png'
        ];

        let loaded = 0;
        let failed = 0;
        const grid = document.getElementById('image-grid');
        const status = document.getElementById('status');
        const failedImages = [];

        function updateStats() {
            document.getElementById('loaded-count').textContent = loaded;
            document.getElementById('failed-count').textContent = failed;
            const progress = Math.round(((loaded + failed) / images.length) * 100);
            document.getElementById('progress').textContent = progress + '%';
            
            if (loaded + failed === images.length) {
                if (failed === 0) {
                    status.className = 'status success';
                    status.innerHTML = '<div class="status-icon">🎉</div><div>Tất cả 59 ảnh đã load thành công!</div>';
                } else {
                    status.className = 'status error';
                    status.innerHTML = `<div class="status-icon">⚠️</div><div>${failed} ảnh không load được:<br><small>${failedImages.join(', ')}</small></div>`;
                }
            }
        }

        images.forEach(imageName => {
            const item = document.createElement('div');
            item.className = 'image-item';
            
            const wrapper = document.createElement('div');
            wrapper.className = 'image-wrapper';
            
            const img = document.createElement('img');
            img.src = `/images/${imageName}`;
            img.alt = imageName;
            
            img.onload = () => {
                loaded++;
                item.classList.add('loaded');
                updateStats();
            };
            
            img.onerror = () => {
                failed++;
                failedImages.push(imageName);
                item.classList.add('failed');
                wrapper.innerHTML = '<div style="color: #ef4444; font-size: 2rem;">❌</div>';
                console.error('Failed to load:', imageName, '- Path:', img.src);
                updateStats();
            };
            
            wrapper.appendChild(img);
            
            const name = document.createElement('div');
            name.className = 'image-name';
            name.textContent = imageName;
            
            item.appendChild(wrapper);
            item.appendChild(name);
            grid.appendChild(item);
        });
    </script>
</body>
</html>
